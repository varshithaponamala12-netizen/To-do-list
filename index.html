<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Planner & To-Do List</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>

    <div class="planner-container">
        <header>
            <h1>TO DO LIST</h1>
            <div class="meta-info">
                <div class="meta-field">Date: <span id="current-date"></span></div>
                <div class="meta-field">Day: <span id="current-day"></span></div>
            </div>
        </header>

        <section class="priorities-section">
            <h3>TOP PRIORITIES:</h3>
            <div class="input-row">
                <input type="text" placeholder="Add primary priority..." id="priority-input">
                <button id="add-priority-btn">Add</button>
            </div>
            <ul id="priorities-list" class="styled-list"></ul>
        </section>

        <div class="grid-content">
            
            <section class="todo-section">
                <h3>TO DO LIST:</h3>
                <div class="input-row">
                    <input type="text" placeholder="Add a task..." id="todo-input">
                    <button id="add-todo-btn">Add</button>
                </div>
                <ul id="main-todo-list" class="styled-list"></ul>
            </section>

            <div class="right-column">
                <section class="reminders-section">
                    <h3>REMINDERS:</h3>
                    <textarea placeholder="Type your daily reminders here..."></textarea>
                </section>

                <section class="notes-section">
                    <h3>NOTES:</h3>
                    <textarea placeholder="Write any extra thoughts or notes here..."></textarea>
                </section>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
